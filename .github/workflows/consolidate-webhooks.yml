name: Consolidate historical webhook alerts

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Existing identity whose allowlisted historical alerts should be copied
        type: choice
        options:
          - Minecraft
          - Steam
        required: true
      dry_run:
        description: Verify and back up only; do not post or remove messages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.destination == 'Minecraft' && 'bedrock-marketplace-watcher' || 'steam-big-sale-watcher' }}
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      DESTINATION: ${{ inputs.destination == 'Minecraft' && 'minecraft' || 'steam' }}
      JOURNAL_PATH: ${{ inputs.destination == 'Minecraft' && '.discord-posts-minecraft.json' || '.discord-posts-steam.json' }}
      BACKUP_DIRECTORY: webhook-consolidation-backup
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test fixed historical consolidation safeguards
        id: tests
        run: python3 -B -m unittest -v test_consolidate_webhooks.py

      - name: Verify and back up historical alerts, applying only when requested
        id: consolidate
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets[inputs.destination == 'Minecraft' && 'DISCORD_WEBHOOK_URL' || 'DISCORD_STEAM_WEBHOOK_URL'] }}
          DISCORD_LEGACY_WEBHOOK_URL: ${{ secrets[inputs.destination == 'Minecraft' && 'DISCORD_MINECRAFT_LEGACY_WEBHOOK_URL' || 'DISCORD_STEAM_LEGACY_WEBHOOK_URL'] }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--apply); fi
          python3 -B consolidate_webhooks.py --destination "$DESTINATION" --journal "$JOURNAL_PATH" --backup-dir "$BACKUP_DIRECTORY" "${args[@]}"

      - name: Save this destination's durable checkpoints even after a partial failure
        if: ${{ always() && !inputs.dry_run && steps.consolidate.outcome != 'skipped' && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "Webhook alert consolidation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$JOURNAL_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Consolidate historical $DESTINATION alert checkpoints [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo "Could not save consolidation checkpoints. Preserve this run's backup before any retry."
          exit 1

      - name: Save verified original-message backups
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verified-original-alerts-${{ inputs.destination }}-${{ github.run_id }}
          path: webhook-consolidation-backup/*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Preserve this destination's journal for partial-failure recovery
        if: ${{ always() && !inputs.dry_run && steps.consolidate.outcome != 'skipped' && steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-checkpoint-${{ inputs.destination }}-${{ github.run_id }}
          path: ${{ env.JOURNAL_PATH }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
