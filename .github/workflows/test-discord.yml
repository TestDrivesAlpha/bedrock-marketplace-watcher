name: Test Discord notification

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Watcher destination to verify with one test message
        type: choice
        default: Minecraft
        options:
          - Minecraft
          - Steam
          - Eneba
          - Pokemon
      expected_channel_id:
        description: Optional Discord channel ID that the acknowledgement must match
        type: string
        required: false
        default: ""
      send_banner:
        description: Save the matching webhook avatar and post one artwork header
        type: boolean
        default: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DISCORD_DESTINATION: ${{ inputs.destination || 'Minecraft' }}
      WEBHOOK_SECRET_NAME: ${{ inputs.destination == 'Steam' && 'DISCORD_STEAM_WEBHOOK_URL' || inputs.destination == 'Eneba' && 'DISCORD_ENEBA_WEBHOOK_URL' || inputs.destination == 'Pokemon' && 'DISCORD_POKEMON_WEBHOOK_URL' || 'DISCORD_WEBHOOK_URL' }}

    steps:
      - name: Verify selected Discord destination
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets[env.WEBHOOK_SECRET_NAME] }}
          EXPECTED_CHANNEL_ID: ${{ inputs.expected_channel_id }}
          SEND_BANNER: ${{ inputs.send_banner && 'true' || 'false' }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          usernames = {
              "Minecraft": "Bedrock Sale Watcher",
              "Steam": "Steam Sale Watcher",
              "Eneba": "Eneba Sale Watcher",
              "Pokemon": "Pokémon Price Watcher",
          }
          artwork = {
              "Minecraft": ("minecraft", "MINECRAFT MARKETPLACE", "Minecraft Bedrock Marketplace packs, creators, Minecoin prices, promotion dates and direct product links.", 0x4D9637),
              "Steam": ("steam-catgirl", "STEAM SALES", "Major Steam seasonal sale dates, official sale artwork and links to the current Steam discounts.", 0x1B9BDF),
              "Eneba": ("eneba", "ENEBA SALES", "Featured Eneba campaigns and Minecoin prepaid-code listings, with activation countries, storefront references and checkout fees shown separately.", 0xF08A34),
              "Pokemon": ("pokemon", "POKÉMON SALES", "Pokémon Sword, Pokémon Violet and their matching DLC: observed prices, format, condition, regional availability and source links.", 0x7B45BB),
          }
          destination = os.environ["DISCORD_DESTINATION"]
          if destination not in usernames:
              raise SystemExit("Unsupported Discord verification destination.")
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("Required repository secret " + os.environ["WEBHOOK_SECRET_NAME"] + " is missing.")
          expected = os.environ.get("EXPECTED_CHANNEL_ID", "").strip()
          if expected and not (expected.isascii() and expected.isdigit()):
              raise SystemExit("expected_channel_id must contain only digits.")
          try:
              parts = urlsplit(webhook)
              query = [(key, value) for key, value in parse_qsl(parts.query) if key != "wait"]
              query.append(("wait", "true"))
              url = urlunsplit(parts._replace(query=urlencode(query)))
              payload = {
                  "username": usernames[destination],
                  "content": "**Webhook destination verification**\nDestination: **" + destination + "**. This is one routing test message.",
                  "allowed_mentions": {"parse": []},
              }
              if os.environ.get("SEND_BANNER", "false") == "true":
                  slug, title, purpose, color = artwork[destination]
                  assets = "https://raw.githubusercontent.com/TestDrivesAlpha/bedrock-marketplace-watcher/main/assets/"
                  control_url = urlunsplit(parts._replace(query="", fragment=""))
                  identity_request = Request(control_url, method="GET",
                                             headers={"User-Agent": "Discord-Destination-Verification/1.0"})
                  with urlopen(identity_request, timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit("Webhook identity check did not return HTTP 200; artwork was not changed.")
                      identity = json.loads(response.read(1_000_000))
                  if not isinstance(identity, dict) or not all(
                      isinstance(identity.get(key), str) and identity[key].isascii() and identity[key].isdigit()
                      for key in ("id", "channel_id")
                  ):
                      raise SystemExit("Webhook identity returned invalid IDs; artwork was not changed.")
                  if expected and identity["channel_id"] != expected:
                      raise SystemExit("Webhook channel differs from expected_channel_id; artwork was not changed.")
                  avatar_url = assets + slug + "-avatar.png"
                  avatar_request = Request(avatar_url, headers={"User-Agent": "Discord-Destination-Verification/1.0"})
                  with urlopen(avatar_request, timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit("Avatar asset download did not return HTTP 200; artwork was not changed.")
                      avatar = response.read(8_000_001)
                  if len(avatar) >= 8_000_000 or not avatar.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise SystemExit("Avatar asset must be a PNG smaller than 8 MB; artwork was not changed.")
                  update = {"avatar": "data:image/png;base64," + base64.b64encode(avatar).decode("ascii")}
                  update_request = Request(control_url, data=json.dumps(update).encode("utf-8"), method="PATCH",
                                           headers={"Content-Type": "application/json", "User-Agent": "Discord-Destination-Verification/1.0"})
                  with urlopen(update_request, timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit("Webhook avatar update did not return HTTP 200; no header was posted.")
                      updated = json.loads(response.read(1_000_000))
                  if not isinstance(updated, dict) or not all(
                      isinstance(updated.get(key), str) and updated[key].isascii() and updated[key].isdigit()
                      for key in ("id", "channel_id")
                  ) or updated["id"] != identity["id"] or updated["channel_id"] != identity["channel_id"] or not isinstance(updated.get("avatar"), str) or not updated["avatar"]:
                      raise SystemExit("Webhook avatar update was not confirmed; no header was posted.")
                  payload.update({
                      "content": "**Channel header — " + title + "**",
                      "avatar_url": avatar_url,
                      "embeds": [{
                          "title": title,
                          "description": purpose,
                          "image": {"url": assets + slug + "-banner.png"},
                          "color": color,
                      }],
                  })
              request = Request(url, data=json.dumps(payload).encode("utf-8"), method="POST",
                                headers={"Content-Type": "application/json", "User-Agent": "Discord-Destination-Verification/1.0"})
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit("Discord destination verification did not return HTTP 200.")
                  acknowledgement = json.loads(response.read(1_000_000))
          except HTTPError as error:
              status = error.code
              error.close()
              raise SystemExit(f"Discord destination verification failed (HTTP {status}).") from None
          except (URLError, TimeoutError, OSError, ValueError):
              raise SystemExit("Discord destination verification failed or returned an invalid acknowledgement.") from None
          if not isinstance(acknowledgement, dict) or not all(
              isinstance(acknowledgement.get(key), str) and acknowledgement[key].isascii() and acknowledgement[key].isdigit()
              for key in ("id", "channel_id")
          ):
              raise SystemExit("Discord destination verification returned invalid message/channel IDs.")
          print(json.dumps({"message_id": acknowledgement["id"], "channel_id": acknowledgement["channel_id"]}))
          if expected and acknowledgement["channel_id"] != expected:
              raise SystemExit("Discord acknowledged a channel different from expected_channel_id.")
          PY
