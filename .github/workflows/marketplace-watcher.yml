name: Bedrock Marketplace Watcher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview alerts without posting to Discord or changing history
        type: boolean
        default: true
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: bedrock-marketplace-watcher
  cancel-in-progress: false

jobs:
  check-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      DISCORD_RETENTION_FILE: .discord-posts-minecraft.json
      DISCORD_RETENTION_SNAPSHOT: .discord-current-minecraft.json
      RETENTION_ENABLED: "true"
      RETENTION_DAYS: "60"
      DISCORD_ORIGINAL_WEBHOOK_ID: "1557461917742669976"

    steps:
      - name: Download my watcher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python for message retention
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate alert formatting and sale checks
        id: tests
        env:
          DISCORD_RETENTION_FILE: ""
          DISCORD_RETENTION_SNAPSHOT: ""
        run: node --test watcher.test.mjs

      - name: Test safe message retention
        id: retention_tests
        env:
          DISCORD_RETENTION_FILE: ""
          DISCORD_RETENTION_SNAPSHOT: ""
        run: python -B -m unittest -v test_discord_retention.py

      - name: Download Marketplace reader
        run: |
          git clone --depth 1 https://github.com/Daniel-Ric/PlayFab-Catalog-Service-Bedrock.git catalog-api
          cd catalog-api
          npm ci --omit=dev

      - name: Start Marketplace reader
        run: |
          ADMIN_PASS="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -hex 32)"

          echo "CATALOG_API_USER=admin" >> "$GITHUB_ENV"
          echo "CATALOG_API_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"

          cd catalog-api

          nohup env \
            PORT=3000 \
            NODE_ENV=production \
            JWT_SECRET="$JWT_SECRET" \
            ADMIN_USER=admin \
            ADMIN_PASS="$ADMIN_PASS" \
            DEFAULT_ALIAS=prod \
            TITLE_ID=20CA2 \
            OS=iOS \
            PLAYFAB_DEVICE_ID=vmc-github-bedrock-marketplace-watcher-001 \
            LOG_LEVEL=warn \
            UPDATE_CHECK_ENABLED=false \
            UPDATE_CHECK_STARTUP_LOG=false \
            ENABLE_SALES_WATCHER=false \
            ENABLE_ITEM_WATCHER=false \
            ENABLE_CONTENT_UPDATE_WATCHER=false \
            ENABLE_PRICE_WATCHER=false \
            ENABLE_TRENDING_WATCHER=false \
            ENABLE_CREATOR_PARTNER_WATCHER=false \
            ENABLE_FEATURED_CONTENT_WATCHER=false \
            ENABLE_SUBSCRIPTION_WATCHER=false \
            node src/index.js > ../catalog-api.log 2>&1 &

          cd ..

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/openapi.json > /dev/null; then
              echo "Marketplace reader is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Marketplace reader failed to start:"
          cat catalog-api.log
          exit 1

      - name: Check Bedrock Marketplace
        id: marketplace
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CATALOG_API_USER: ${{ env.CATALOG_API_USER }}
          CATALOG_API_PASS: ${{ env.CATALOG_API_PASS }}
          MIN_DISCOUNT: "1"
        run: |
          cp watcher.js watcher.mjs
          node watcher.mjs

      - name: Refresh or remove tracked alerts older than 60 days
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.retention_tests.outcome == 'success' && (steps.marketplace.outcome == 'success' || steps.marketplace.outcome == 'failure') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_LEGACY_WEBHOOK_URL: ${{ secrets.DISCORD_MINECRAFT_LEGACY_WEBHOOK_URL }}
        run: |
          if [ ! -f "$DISCORD_RETENTION_SNAPSHOT" ]; then
            echo "No fresh Marketplace snapshot; cleanup is deferred."
            exit 0
          fi
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -B discord_retention.py --destination minecraft --journal "$DISCORD_RETENTION_FILE" --snapshot "$DISCORD_RETENTION_SNAPSHOT" "${args[@]}"

      - name: Save discount history
        if: ${{ !cancelled() && (steps.marketplace.outcome == 'success' || steps.marketplace.outcome == 'failure') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          MONTH="$(date -u +%Y-%m)"

          if [ "$(cat .watcher-heartbeat 2>/dev/null || true)" != "$MONTH" ]; then
            echo "$MONTH" > .watcher-heartbeat
          fi

          git config user.name "Bedrock Sale Watcher"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f watcher-state.json ]; then
            git add watcher-state.json
          fi
          if [ -f "$DISCORD_RETENTION_FILE" ]; then
            git add -- "$DISCORD_RETENTION_FILE"
          fi

          git add .watcher-heartbeat

          if git diff --cached --quiet; then
            echo "No watcher history changes to save."
          else
            git commit -m "Update Marketplace watcher history [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep "$((attempt * 2))"
            done
            echo "Could not save Marketplace delivery checkpoints."
            exit 1
          fi
