name: Steam Big Sale Watcher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview active sale alerts without sending to Discord
        type: boolean
        default: true
  schedule:
    # Checks once every hour.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: steam-big-sale-watcher
  cancel-in-progress: false

jobs:
  check-steam-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      DISCORD_RETENTION_FILE: .discord-posts-steam.json
      DISCORD_RETENTION_SNAPSHOT: .discord-current-steam.json
      RETENTION_ENABLED: "true"
      RETENTION_DAYS: "60"
      DISCORD_ORIGINAL_WEBHOOK_ID: "1557498149772333176"

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Steam sale alerts
        id: tests
        env:
          DISCORD_RETENTION_FILE: ""
          DISCORD_RETENTION_SNAPSHOT: ""
        run: python3 -m unittest -v test_steam_watcher.py

      - name: Test safe message retention
        id: retention_tests
        env:
          DISCORD_RETENTION_FILE: ""
          DISCORD_RETENTION_SNAPSHOT: ""
        run: python3 -B -m unittest -v test_discord_retention.py

      - name: Check major Steam sales
        id: sales
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STEAM_WEBHOOK_URL }}
        run: |
          python3 steam_watcher.py

      - name: Refresh or remove tracked alerts older than 60 days
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.retention_tests.outcome == 'success' && (steps.sales.outcome == 'success' || steps.sales.outcome == 'failure') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STEAM_WEBHOOK_URL }}
          DISCORD_LEGACY_WEBHOOK_URL: ${{ secrets.DISCORD_STEAM_LEGACY_WEBHOOK_URL }}
        run: |
          if [ ! -f "$DISCORD_RETENTION_SNAPSHOT" ]; then
            echo "No fresh Steam snapshot; cleanup is deferred."
            exit 0
          fi
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 -B discord_retention.py --destination steam --journal "$DISCORD_RETENTION_FILE" --snapshot "$DISCORD_RETENTION_SNAPSHOT" "${args[@]}"

      - name: Save notification history
        if: ${{ !cancelled() && (steps.sales.outcome == 'success' || steps.sales.outcome == 'failure') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "Steam Sale Watcher"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for file in .steam-sale-notified "$DISCORD_RETENTION_FILE"; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done

          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi

          git commit -m "Update Steam sale notification history [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo "Could not save Steam delivery checkpoints."
          exit 1
