name: Steam Big Sale Watcher

on:
  workflow_dispatch:
  schedule:
    # Checks once every hour.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: steam-big-sale-watcher
  cancel-in-progress: false

jobs:
  check-steam-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check major Steam sales
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STEAM_WEBHOOK_URL }}
        run: |
          python3 <<'PY'
          import os
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")

          if not webhook:
              raise RuntimeError(
                  "DISCORD_STEAM_WEBHOOK_URL secret is missing."
              )

          now = datetime.now(timezone.utc)

          # Major Steam-wide seasonal sales.
          sales = [
              {
                  "id": "autumn-2026",
                  "name": "Steam Autumn Sale 2026",
                  "start": "2026-10-01T17:00:00+00:00",
                  "end": "2026-10-08T17:00:00+00:00",
              },
              {
                  "id": "winter-2026",
                  "name": "Steam Winter Sale 2026",
                  "start": "2026-12-17T18:00:00+00:00",
                  "end": "2027-01-04T18:00:00+00:00",
              },
              {
                  "id": "spring-2027",
                  "name": "Steam Spring Sale 2027",
                  "start": "2027-03-18T17:00:00+00:00",
                  "end": "2027-03-25T17:00:00+00:00",
              },
              {
                  "id": "summer-2027",
                  "name": "Steam Summer Sale 2027",
                  "start": "2027-06-24T17:00:00+00:00",
                  "end": "2027-07-08T17:00:00+00:00",
              },
          ]

          state_file = Path(".steam-sale-notified")

          already_notified = set()

          if state_file.exists():
              already_notified = {
                  line.strip()
                  for line in state_file.read_text().splitlines()
                  if line.strip()
              }

          changed = False

          for sale in sales:
              start = datetime.fromisoformat(sale["start"])
              end = datetime.fromisoformat(sale["end"])

              # Ignore sales that aren't currently active.
              if not (start <= now < end):
                  continue

              # Never spam the same sale repeatedly.
              if sale["id"] in already_notified:
                  print(f"Already notified: {sale['name']}")
                  continue

              start_unix = int(start.timestamp())
              end_unix = int(end.timestamp())

              payload = {
                  "content": (
                      "🔥 **BIG STEAM SALE IS LIVE**\n"
                      f"## {sale['name']}\n\n"
                      "A major Steam-wide seasonal sale has started. "
                      "This is one of the big periods where large numbers "
                      "of games receive discounts across Steam.\n\n"
                      f"🟢 Started: <t:{start_unix}:F>\n"
                      f"⏳ Ends: <t:{end_unix}:F> (<t:{end_unix}:R>)\n\n"
                      "🛒 https://store.steampowered.com/"
                  )
              }

              result = subprocess.run(
                  [
                      "curl",
                      "-fSs",
                      "-X", "POST",
                      "-H", "Content-Type: application/json",
                      "-H", "User-Agent: Steam-Sale-Watcher/1.0",
                      "--data-binary", json.dumps(payload),
                      webhook,
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      "Discord webhook failed:\n"
                      + result.stderr
                  )

              print(f"Discord notified: {sale['name']}")

              already_notified.add(sale["id"])
              changed = True

          if changed:
              state_file.write_text(
                  "\n".join(sorted(already_notified)) + "\n"
              )
          else:
              print("No new major Steam sale to announce.")
          PY

      - name: Save notification history
        run: |
          if [ ! -f .steam-sale-notified ]; then
            echo "No notification history file yet."
            exit 0
          fi

          git config user.name "Steam Sale Watcher"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .steam-sale-notified

          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi

          git commit -m "Update Steam sale notification history [skip ci]"

          git pull --rebase origin main
          git push
