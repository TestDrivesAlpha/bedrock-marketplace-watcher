name: Steam Big Sale Watcher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview active sale alerts without sending to Discord
        type: boolean
        default: true
  schedule:
    # Checks once every hour.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: steam-big-sale-watcher
  cancel-in-progress: false

jobs:
  check-steam-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Steam sale alerts
        run: python3 -m unittest -v test_steam_watcher.py

      - name: Check major Steam sales
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STEAM_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python3 steam_watcher.py

      - name: Save notification history
        run: |
          if [ ! -f .steam-sale-notified ]; then
            echo "No notification history file yet."
            exit 0
          fi

          git config user.name "Steam Sale Watcher"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .steam-sale-notified

          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi

          git commit -m "Update Steam sale notification history [skip ci]"

          git pull --rebase origin main
          git push
